name: Update Goan E-Papers

on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Update newspaper editions
        run: python update.py

      - name: Commit updated newspaper data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add newspaper-data.json
          
          # Prevent push conflicts if video data was pushed recently
          git pull --rebase origin main || true

          git diff --cached --quiet || git commit -m "Update newspaper editions"
          git push origin HEAD

      - name: Prepare GitHub Pages files
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp newspaper.html _site/newspaper.html
          cp data.json _site/data.json
          cp newspaper-data.json _site/newspaper-data.json

          # Copy critical SEO & Legal files so they don't 404
          [ -f sitemap.xml ] && cp sitemap.xml _site/sitemap.xml
          [ -f robots.txt ] && cp robots.txt _site/robots.txt
          [ -f privacy-policy.html ] && cp privacy-policy.html _site/privacy-policy.html
          [ -f channels.json ] && cp channels.json _site/channels.json
          [ -f goa-news-logo.png ] && cp goa-news-logo.png _site/goa-news-logo.png
          [ -d assets ] && cp -r assets _site/assets

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
