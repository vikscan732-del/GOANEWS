name: Update Video Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install feedparser
        run: pip install feedparser

      - name: Fetch and update RSS feeds
        run: |
          python << 'EOF'
          import feedparser
          import json
          import sys
          import os
          import re
          from difflib import SequenceMatcher
          from email.utils import parsedate_to_datetime

          feeds = [
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCzipBcQBo9rFNV58nfP-KyQ",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCE9AZSYybiCWNYKr9gbY1lA",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCJb1MeQClvGeSMeBSVLKnDQ",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCDFOkbaN9IuV6tjO8Aqo1ww",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UC-i0Rvr1-JtE2A8Z5RuVatg",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCUtU4cVsod9zzLHpL5xM0kQ",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCETBxO93JjoGNkH1zRB0zwg",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCAYM7lIXVbOpCkXKSOBB44A"
          ]

          DATA_FILE = "data.json"
          MAX_VIDEOS = 300

          # --------------------------------------------------
          # Words that identify unwanted videos
          # --------------------------------------------------

          UNWANTED_WORDS = [
              "advt",
              "advertisement",
              "advertisement:",
              "sponsored",
              "sponsor",
              "promo",
              "promotion",
              "commercial",
              "publicity",
              "trailer",
              "teaser"
          ]

          LIVE_WORDS = [
              "live",
              "live:",
              "| live",
              "live |",
              "livestream",
              "live stream",
              "live interaction",
              "press conference live",
              "happening now"
          ]

          SHORT_WORDS = [
              "#shorts",
              "#short",
              "youtube shorts"
          ]

          # --------------------------------------------------
          # Helpers
          # --------------------------------------------------

          def normalize_text(text):
              text = (text or "").lower()

              # Remove URLs
              text = re.sub(r"https?://\S+", " ", text)

              # Remove hashtags
              text = re.sub(r"#\S+", " ", text)

              # Remove common filler words.
              # Keep the actual news words for duplicate detection.
              filler = [
                  "breaking", "latest", "update", "updates",
                  "exclusive", "watch", "today", "news",
                  "goa news", "goanews", "goa"
              ]

              for word in filler:
                  text = re.sub(
                      r"(?<!\w)" + re.escape(word) + r"(?!\w)",
                      " ",
                      text
                  )

              # Keep Unicode letters/numbers and spaces.
              text = re.sub(r"[^\w\s]", " ", text, flags=re.UNICODE)
              text = re.sub(r"\s+", " ", text).strip()

              return text


          def contains_word(text, words):
              value = (text or "").lower()

              for word in words:
                  word = word.lower()

                  if word in value:
                      return True

              return False


          def is_short(video):
              title = video.get("title", "")
              link = video.get("link", "")

              if "/shorts/" in link.lower():
                  return True

              if contains_word(title, SHORT_WORDS):
                  return True

              return False


          def is_live(video):
              title = video.get("title", "")
              link = video.get("link", "")

              if contains_word(title, LIVE_WORDS):
                  return True

              # YouTube RSS links are normally watch URLs.
              # Do not classify a normal watch URL as live by itself.
              return False


          def is_advertisement(video):
              title = video.get("title", "")

              return contains_word(title, UNWANTED_WORDS)


          def similarity(title1, title2):
              a = normalize_text(title1)
              b = normalize_text(title2)

              if not a or not b:
                  return 0.0

              if a == b:
                  return 1.0

              ratio = SequenceMatcher(None, a, b).ratio()

              words_a = set(a.split())
              words_b = set(b.split())

              if words_a and words_b:
                  union = words_a | words_b
                  intersection = words_a & words_b
                  jaccard = len(intersection) / len(union)
              else:
                  jaccard = 0.0

              return max(ratio, jaccard)


          def published_timestamp(value):
              if not value:
                  return 0

              try:
                  return parsedate_to_datetime(value).timestamp()
              except Exception:
                  return 0


          # --------------------------------------------------
          # Load existing history
          # --------------------------------------------------

          old_videos = []

          if os.path.exists(DATA_FILE):
              try:
                  with open(DATA_FILE, "r", encoding="utf-8") as f:
                      old_videos = json.load(f)

                  if not isinstance(old_videos, list):
                      old_videos = []

              except Exception as e:
                  print(f"WARNING: Could not read existing data.json: {e}")
                  old_videos = []

          print(f"Existing videos: {len(old_videos)}")

          # --------------------------------------------------
          # Fetch RSS feeds
          # --------------------------------------------------

          new_videos = []

          for i, feed_url in enumerate(feeds, 1):
              print("")
              print(f"Checking feed {i}...")

              try:
                  feed = feedparser.parse(feed_url)

                  print(f"HTTP status: {getattr(feed, 'status', 'unknown')}")
                  print(f"Videos found: {len(feed.entries)}")

                  for entry in feed.entries:
                      video_id = entry.get("yt_videoid", "")
                      if not video_id:
                          video_id = entry.get("id", "")

                      title = entry.get("title", "").strip()
                      published = entry.get("published", "")
                      link = entry.get("link", "")

                      if not video_id or not title:
                          continue

                      video = {
                          "id": video_id,
                          "title": title,
                          "published": published,
                          "channel": "Goa News 24",
                          "link": link
                      }

                      # Remove Shorts
                      if is_short(video):
                          print(f"SKIP SHORT: {title}")
                          continue

                      # Remove advertisements/promos
                      if is_advertisement(video):
                          print(f"SKIP AD: {title}")
                          continue

                      # Remove LIVE videos
                      if is_live(video):
                          print(f"SKIP LIVE: {title}")
                          continue

                      new_videos.append(video)

              except Exception as e:
                  print(f"FEED ERROR: {e}")

          print("")
          print("==============================")
          print(f"New usable videos: {len(new_videos)}")
          print("==============================")

          # --------------------------------------------------
          # Combine old history + new RSS videos
          # --------------------------------------------------

          combined = old_videos + new_videos

          # --------------------------------------------------
          # First remove exact duplicate YouTube video IDs
          # --------------------------------------------------

          combined.sort(
              key=lambda x: published_timestamp(x.get("published", "")),
              reverse=True
          )

          unique_by_id = []
          seen_ids = set()

          for video in combined:
              video_id = video.get("id", "")

              if not video_id:
                  continue

              if video_id in seen_ids:
                  continue

              seen_ids.add(video_id)

              # Always show the desired app label.
              video["channel"] = "Goa News 24"

              unique_by_id.append(video)

          print(f"After video-ID deduplication: {len(unique_by_id)}")

          # --------------------------------------------------
          # Remove near-identical news stories
          #
          # 0.90 = very similar title
          # 0.80 Jaccard = same important words
          # --------------------------------------------------

          final_videos = []

          for video in unique_by_id:
              title = video.get("title", "")
              duplicate = False

              for existing in final_videos:
                  existing_title = existing.get("title", "")

                  score = similarity(title, existing_title)

                  if score >= 0.90:
                      print("")
                      print("SKIP DUPLICATE NEWS:")
                      print(f"  {title}")
                      print(f"  Similar to: {existing_title}")
                      duplicate = True
                      break

                  # For titles with enough words, use a slightly
                  # stricter word-overlap test.
                  a = set(normalize_text(title).split())
                  b = set(normalize_text(existing_title).split())

                  if len(a) >= 5 and len(b) >= 5:
                      union = a | b
                      intersection = a & b

                      if union:
                          jaccard = len(intersection) / len(union)

                          if jaccard >= 0.80:
                              print("")
                              print("SKIP SAME NEWS:")
                              print(f"  {title}")
                              print(f"  Similar to: {existing_title}")
                              duplicate = True
                              break

              if not duplicate:
                  final_videos.append(video)

          # --------------------------------------------------
          # Keep newest 300 videos
          # --------------------------------------------------

          final_videos.sort(
              key=lambda x: published_timestamp(x.get("published", "")),
              reverse=True
          )

          final_videos = final_videos[:MAX_VIDEOS]

          print("")
          print("==============================")
          print(f"FINAL VIDEOS STORED: {len(final_videos)}")
          print("==============================")

          # --------------------------------------------------
          # Safety: never erase valid history because RSS fails
          # --------------------------------------------------

          if len(final_videos) == 0:
              print("ERROR: No usable videos.")
              print("Keeping existing data.json.")
              sys.exit(1)

          # --------------------------------------------------
          # Save
          # --------------------------------------------------

          with open(DATA_FILE, "w", encoding="utf-8") as f:
              json.dump(
                  final_videos,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("SUCCESS: data.json updated.")

          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data.json

          git diff --cached --quiet || \
            git commit -m "Automated video data update"

          git push
