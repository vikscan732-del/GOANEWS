name: Update Video Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install feedparser
        run: pip install feedparser

      - name: Fetch, clean and update RSS feeds
        run: |
          python << 'EOF'
          import feedparser
          import json
          import sys
          import os
          import re
          from difflib import SequenceMatcher
          from email.utils import parsedate_to_datetime

          feeds = [
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCzipBcQBo9rFNV58nfP-KyQ",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCE9AZSYybiCWNYKr9gbY1lA",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCJb1MeQClvGeSMeBSVLKnDQ",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCDFOkbaN9IuV6tjO8Aqo1ww",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UC-i0Rvr1-JtE2A8Z5RuVatg",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCUtU4cVsod9zzLHpL5xM0kQ",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCETBxO93JjoGNkH1zRB0zwg",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCAYM7lIXVbOpCkXKSOBB44A"
          ]

          DATA_FILE = "data.json"
          MAX_VIDEOS = 300
          DISPLAY_CHANNEL = "Goa News 24"

          # --------------------------------------------------
          # Unwanted content
          # --------------------------------------------------

          AD_WORDS = [
              "advt",
              "advertisement",
              "advertising",
              "sponsored",
              "sponsor",
              "promo",
              "promotion",
              "commercial",
              "publicity"
          ]

          LIVE_PHRASES = [
              "live",
              "live:",
              "live |",
              "| live",
              "livestream",
              "live stream",
              "live interaction",
              "happening now",
              "press conference live"
          ]

          SHORT_PHRASES = [
              "#shorts",
              "#short",
              "youtube shorts"
          ]

          def has_phrase(text, phrases):
              value = (text or "").lower()
              for phrase in phrases:
                  if phrase in value:
                      return True
              return False

          def is_short(video):
              title = video.get("title", "")
              link = video.get("link", "")

              if "/shorts/" in link.lower():
                  return True

              return has_phrase(title, SHORT_PHRASES)

          def is_live(video):
              title = video.get("title", "")
              return has_phrase(title, LIVE_PHRASES)

          def is_ad(video):
              title = video.get("title", "")
              return has_phrase(title, AD_WORDS)

          def clean_title(title):
              text = (title or "").lower()

              text = re.sub(r"https?://\S+", " ", text)
              text = re.sub(r"#\S+", " ", text)

              # Remove common reporting/filler words.
              filler = [
                  "breaking",
                  "latest",
                  "update",
                  "updates",
                  "exclusive",
                  "watch",
                  "today",
                  "news",
                  "goa news",
                  "goanews"
              ]

              for word in filler:
                  text = re.sub(
                      r"(?<!\w)" + re.escape(word) + r"(?!\w)",
                      " ",
                      text
                  )

              text = re.sub(r"[^\w\s]", " ", text, flags=re.UNICODE)
              text = re.sub(r"\s+", " ", text).strip()

              return text

          def news_similarity(title1, title2):
              a = clean_title(title1)
              b = clean_title(title2)

              if not a or not b:
                  return 0.0

              if a == b:
                  return 1.0

              ratio = SequenceMatcher(None, a, b).ratio()

              wa = set(a.split())
              wb = set(b.split())

              if wa and wb:
                  union = wa | wb
                  intersection = wa & wb
                  jaccard = len(intersection) / len(union)
              else:
                  jaccard = 0.0

              return max(ratio, jaccard)

          def timestamp(value):
              if not value:
                  return 0

              try:
                  return parsedate_to_datetime(value).timestamp()
              except Exception:
                  return 0

          # --------------------------------------------------
          # Load existing data
          # --------------------------------------------------

          old_videos = []

          if os.path.exists(DATA_FILE):
              try:
                  with open(DATA_FILE, "r", encoding="utf-8") as f:
                      old_videos = json.load(f)

                  if not isinstance(old_videos, list):
                      old_videos = []

              except Exception as e:
                  print(f"WARNING: Could not read data.json: {e}")
                  old_videos = []

          print(f"Existing videos loaded: {len(old_videos)}")

          # --------------------------------------------------
          # Fetch new RSS videos
          # --------------------------------------------------

          new_videos = []

          for i, feed_url in enumerate(feeds, 1):
              print("")
              print(f"Checking feed {i}...")

              try:
                  feed = feedparser.parse(feed_url)

                  print(f"HTTP status: {getattr(feed, 'status', 'unknown')}")
                  print(f"RSS entries: {len(feed.entries)}")

                  for entry in feed.entries:
                      video_id = entry.get("yt_videoid", "")

                      if not video_id:
                          video_id = entry.get("id", "")

                      title = entry.get("title", "").strip()
                      published = entry.get("published", "")
                      link = entry.get("link", "")

                      if not video_id or not title:
                          continue

                      new_videos.append({
                          "id": video_id,
                          "title": title,
                          "published": published,
                          "channel": DISPLAY_CHANNEL,
                          "link": link
                      })

              except Exception as e:
                  print(f"FEED ERROR: {e}")

          print("")
          print(f"New RSS videos fetched: {len(new_videos)}")

          # --------------------------------------------------
          # IMPORTANT:
          # Clean BOTH old and new videos.
          #
          # This fixes old Advt/Live videos that were already
          # stored in data.json before this workflow was installed.
          # --------------------------------------------------

          combined = old_videos + new_videos

          cleaned = []

          removed_ads = 0
          removed_live = 0
          removed_shorts = 0

          for video in combined:
              if not isinstance(video, dict):
                  continue

              title = video.get("title", "")
              link = video.get("link", "")

              if not title:
                  continue

              # Always replace old YouTube channel names.
              video["channel"] = DISPLAY_CHANNEL

              if is_short(video):
                  removed_shorts += 1
                  print(f"SKIP SHORT: {title}")
                  continue

              if is_ad(video):
                  removed_ads += 1
                  print(f"SKIP ADVERTISEMENT: {title}")
                  continue

              if is_live(video):
                  removed_live += 1
                  print(f"SKIP LIVE: {title}")
                  continue

              cleaned.append(video)

          print("")
          print("==============================")
          print(f"Removed Shorts: {removed_shorts}")
          print(f"Removed Ads: {removed_ads}")
          print(f"Removed Live: {removed_live}")
          print(f"Remaining after content filter: {len(cleaned)}")
          print("==============================")

          # --------------------------------------------------
          # Sort newest first
          # --------------------------------------------------

          cleaned.sort(
              key=lambda x: timestamp(x.get("published", "")),
              reverse=True
          )

          # --------------------------------------------------
          # Remove exact duplicate YouTube videos
          # --------------------------------------------------

          unique = []
          seen_ids = set()

          for video in cleaned:
              video_id = video.get("id", "")

              if not video_id:
                  continue

              if video_id in seen_ids:
                  continue

              seen_ids.add(video_id)

              video["channel"] = DISPLAY_CHANNEL
              unique.append(video)

          print(f"After video-ID deduplication: {len(unique)}")

          # --------------------------------------------------
          # Remove duplicate/same news stories
          #
          # Keep the newest version and remove an older
          # video when the titles are nearly identical.
          # --------------------------------------------------

          final_videos = []

          for video in unique:
              title = video.get("title", "")
              duplicate = False

              for existing in final_videos:
                  existing_title = existing.get("title", "")

                  score = news_similarity(title, existing_title)

                  if score >= 0.90:
                      print("")
                      print("SKIP DUPLICATE NEWS:")
                      print(f"  Newer: {existing_title}")
                      print(f"  Older: {title}")
                      duplicate = True
                      break

                  a = set(clean_title(title).split())
                  b = set(clean_title(existing_title).split())

                  if len(a) >= 5 and len(b) >= 5:
                      union = a | b
                      intersection = a & b

                      if union:
                          jaccard = len(intersection) / len(union)

                          if jaccard >= 0.80:
                              print("")
                              print("SKIP SAME NEWS:")
                              print(f"  Newer: {existing_title}")
                              print(f"  Older: {title}")
                              duplicate = True
                              break

              if not duplicate:
                  final_videos.append(video)

          # --------------------------------------------------
          # Keep newest 300
          # --------------------------------------------------

          final_videos.sort(
              key=lambda x: timestamp(x.get("published", "")),
              reverse=True
          )

          final_videos = final_videos[:MAX_VIDEOS]

          print("")
          print("==============================")
          print(f"FINAL VIDEOS: {len(final_videos)}")
          print("==============================")

          # --------------------------------------------------
          # Safety
          # --------------------------------------------------

          if len(final_videos) == 0:
              print("ERROR: No usable videos.")
              print("Keeping existing data.json.")
              sys.exit(1)

          # --------------------------------------------------
          # Save cleaned data
          # --------------------------------------------------

          with open(DATA_FILE, "w", encoding="utf-8") as f:
              json.dump(
                  final_videos,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("SUCCESS: data.json updated.")
          print(f"All stored videos use channel label: {DISPLAY_CHANNEL}")

          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data.json

          git diff --cached --quiet || \
            git commit -m "Clean and update video data"

          git push
