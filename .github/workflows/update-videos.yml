name: Update Video Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install feedparser
        run: pip install feedparser

      - name: Fetch and clean video data
        run: |
          python << 'EOF'
          import feedparser
          import json
          import os
          import re
          import sys
          from difflib import SequenceMatcher
          from email.utils import parsedate_to_datetime

          feeds = [
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCzipBcQBo9rFNV58nfP-KyQ",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCE9AZSYybiCWNYKr9gbY1lA",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCJb1MeQClvGeSMeBSVLKnDQ",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCDFOkbaN9IuV6tjO8Aqo1ww",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UC-i0Rvr1-JtE2A8Z5RuVatg",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCUtU4cVsod9zzLHpL5xM0kQ",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCETBxO93JjoGNkH1zRB0zwg",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCAYM7lIXVbOpCkXKSOBB44A"
          ]

          DATA_FILE = "data.json"
          MAX_VIDEOS = 300
          DISPLAY_CHANNEL = "Goa News 24"

          AD_WORDS = [
              "advt",
              "advert",
              "advertisement",
              "advertising",
              "sponsored",
              "sponsor",
              "promo",
              "promotion",
              "commercial",
              "publicity"
          ]

          LIVE_PHRASES = [
              "live",
              "livestream",
              "live stream",
              "live interaction",
              "happening now",
              "press conference live"
          ]

          SHORT_PHRASES = [
              "#shorts",
              "#short",
              "youtube shorts"
          ]

          def has_phrase(text, phrases):
              value = (text or "").lower()
              return any(x in value for x in phrases)

          def is_short(video):
              title = video.get("title", "")
              link = video.get("link", "")

              return (
                  "/shorts/" in link.lower()
                  or has_phrase(title, SHORT_PHRASES)
              )

          def is_live(video):
              return has_phrase(video.get("title", ""), LIVE_PHRASES)

          def is_ad(video):
              return has_phrase(video.get("title", ""), AD_WORDS)

          def clean_title(title):
              text = (title or "").lower()

              text = re.sub(r"https?://\S+", " ", text)
              text = re.sub(r"#\S+", " ", text)

              # Remove common filler words but keep the actual story.
              for word in [
                  "breaking",
                  "latest",
                  "update",
                  "updates",
                  "exclusive",
                  "watch",
                  "today",
                  "news",
                  "goa news",
                  "goanews"
              ]:
                  text = re.sub(
                      r"(?<!\w)" + re.escape(word) + r"(?!\w)",
                      " ",
                      text
                  )

              text = re.sub(r"[^\w\s]", " ", text, flags=re.UNICODE)
              return re.sub(r"\s+", " ", text).strip()

          def similarity(a, b):
              a = clean_title(a)
              b = clean_title(b)

              if not a or not b:
                  return 0.0

              if a == b:
                  return 1.0

              ratio = SequenceMatcher(None, a, b).ratio()

              wa = set(a.split())
              wb = set(b.split())

              if wa and wb:
                  union = wa | wb
                  intersection = wa & wb
                  jaccard = len(intersection) / len(union)
              else:
                  jaccard = 0.0

              return max(ratio, jaccard)

          def timestamp(value):
              try:
                  return parsedate_to_datetime(value).timestamp()
              except Exception:
                  return 0

          # --------------------------------------------------
          # Load old data.
          # --------------------------------------------------

          old_videos = []

          if os.path.exists(DATA_FILE):
              try:
                  with open(DATA_FILE, "r", encoding="utf-8") as f:
                      old_videos = json.load(f)

                  if not isinstance(old_videos, list):
                      old_videos = []

              except Exception as e:
                  print(f"WARNING: Could not read old data: {e}")

          print(f"Existing videos: {len(old_videos)}")

          # --------------------------------------------------
          # Fetch new RSS videos.
          # --------------------------------------------------

          new_videos = []

          for number, feed_url in enumerate(feeds, 1):
              print(f"\nChecking feed {number}...")

              try:
                  feed = feedparser.parse(feed_url)

                  print(f"HTTP status: {getattr(feed, 'status', 'unknown')}")
                  print(f"RSS entries: {len(feed.entries)}")

                  for entry in feed.entries:
                      video_id = entry.get("yt_videoid", "")
                      if not video_id:
                          video_id = entry.get("id", "")

                      title = entry.get("title", "").strip()
                      published = entry.get("published", "")
                      link = entry.get("link", "")

                      if not video_id or not title:
                          continue

                      new_videos.append({
                          "id": video_id,
                          "title": title,
                          "published": published,
                          "channel": DISPLAY_CHANNEL,
                          "link": link
                      })

              except Exception as e:
                  print(f"FEED ERROR: {e}")

          print(f"\nNew RSS videos: {len(new_videos)}")

          # --------------------------------------------------
          # Combine old + new.
          #
          # IMPORTANT: Rebuild every item from only these fields.
          # This removes old description/subtitle fields completely.
          # --------------------------------------------------

          combined = old_videos + new_videos
          cleaned = []

          removed_ads = 0
          removed_live = 0
          removed_shorts = 0

          for item in combined:
              if not isinstance(item, dict):
                  continue

              title = str(item.get("title", "")).strip()
              video_id = str(
                  item.get("id", "") or item.get("videoId", "")
              ).strip()

              link = str(item.get("link", "")).strip()
              published = str(item.get("published", "")).strip()

              if not title or not video_id:
                  continue

              # Rebuild the object.
              # NO description field is kept.
              video = {
                  "id": video_id,
                  "title": title,
                  "published": published,
                  "channel": DISPLAY_CHANNEL,
                  "link": link
              }

              if is_short(video):
                  removed_shorts += 1
                  continue

              if is_ad(video):
                  removed_ads += 1
                  continue

              if is_live(video):
                  removed_live += 1
                  continue

              cleaned.append(video)

          print(f"Removed Shorts: {removed_shorts}")
          print(f"Removed Ads: {removed_ads}")
          print(f"Removed Live: {removed_live}")

          # --------------------------------------------------
          # Newest first.
          # --------------------------------------------------

          cleaned.sort(
              key=lambda x: timestamp(x["published"]),
              reverse=True
          )

          # --------------------------------------------------
          # Remove exact duplicate video IDs.
          # --------------------------------------------------

          unique = []
          seen_ids = set()

          for video in cleaned:
              if video["id"] in seen_ids:
                  continue

              seen_ids.add(video["id"])
              unique.append(video)

          print(f"After video deduplication: {len(unique)}")

          # --------------------------------------------------
          # Remove same / nearly same news.
          # --------------------------------------------------

          final_videos = []

          for video in unique:
              duplicate = False

              for existing in final_videos:
                  score = similarity(
                      video["title"],
                      existing["title"]
                  )

                  if score >= 0.90:
                      print(
                          "Duplicate news removed:",
                          video["title"]
                      )
                      duplicate = True
                      break

                  words_a = set(clean_title(video["title"]).split())
                  words_b = set(clean_title(existing["title"]).split())

                  if len(words_a) >= 5 and len(words_b) >= 5:
                      union = words_a | words_b
                      intersection = words_a & words_b

                      if union:
                          jaccard = len(intersection) / len(union)

                          if jaccard >= 0.80:
                              print(
                                  "Same news removed:",
                                  video["title"]
                              )
                              duplicate = True
                              break

              if not duplicate:
                  final_videos.append(video)

          # --------------------------------------------------
          # Keep up to 300.
          # --------------------------------------------------

          final_videos = final_videos[:MAX_VIDEOS]

          if not final_videos:
              print("ERROR: No usable videos.")
              print("Keeping existing data.json.")
              sys.exit(1)

          # --------------------------------------------------
          # Save ONLY:
          # id, title, published, channel, link
          #
          # No description/subtitle is stored.
          # --------------------------------------------------

          with open(DATA_FILE, "w", encoding="utf-8") as f:
              json.dump(
                  final_videos,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("\n==============================")
          print(f"FINAL VIDEOS: {len(final_videos)}")
          print("Description fields removed.")
          print(f"Channel label: {DISPLAY_CHANNEL}")
          print("==============================")

          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data.json

          git diff --cached --quiet || \
            git commit -m "Clean video feed and remove duplicate descriptions"

          git push
