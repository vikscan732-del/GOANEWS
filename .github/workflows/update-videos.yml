name: Update Video Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install feedparser
        run: pip install feedparser

      - name: Fetch and combine RSS feeds
        run: |
          python << 'EOF'
          import feedparser
          import json

          feeds = [
            "https://www.youtube.com/feeds/videos.xml?channel_id=UCzipBcQBo9rFNV58nfP-KyQ",
            "https://www.youtube.com/feeds/videos.xml?channel_id=UCE9AZSYybiCWNYKr9gbY1lA",
            "https://www.youtube.com/feeds/videos.xml?channel_id=UCJb1MeQClvGeSMeBSVLKnDQ",
            "https://www.youtube.com/feeds/videos.xml?channel_id=UCDFOkbaN9IuV6tjO8Aqo1ww",
            "https://www.youtube.com/feeds/videos.xml?channel_id=UC-i0Rvr1-JtE2A8Z5RuVatg",
            "https://www.youtube.com/feeds/videos.xml?channel_id=UCUtU4cVsod9zzLHpL5xM0kQ",
            "https://www.youtube.com/feeds/videos.xml?channel_id=UCETBxO93JjoGNkH1zRB0zwg",
            "https://www.youtube.com/feeds/videos.xml?channel_id=UCAYM7lIXVbOpCkXKSOBB44A"
          ]

          all_videos = []
          for feed_url in feeds:
              feed = feedparser.parse(feed_url)
              for entry in feed.entries:
                  all_videos.append({
                      'id': entry.id,
                      'title': entry.title,
                      'published': entry.published,
                      'channel': entry.author_detail.name if hasattr(entry, 'author_detail') else entry.author,
                      'link': entry.link
                  })

          all_videos.sort(key=lambda x: x['published'], reverse=True)
          seen = set()
          unique = []
          for v in all_videos:
              if v['id'] not in seen:
                  seen.add(v['id'])
                  unique.append(v)

          with open('data.json', 'w') as f:
              json.dump(unique, f, indent=2)
          print(f"✅ Fetched {len(unique)} videos")
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Automated video data update" || echo "No changes"
          git push
