name: Update Video Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install feedparser

      - name: Write script file
        run: |
          cat << 'EOF' > update_videos.py
          import feedparser
          import json
          import os
          import re
          import sys
          from difflib import SequenceMatcher
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime

          feeds = [
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCzipBcQBo9rFNV58nfP-KyQ",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCE9AZSYybiCWNYKr9gbY1lA",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCJb1MeQClvGeSMeBSVLKnDQ",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCDFOkbaN9IuV6tjO8Aqo1ww",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UC-i0Rvr1-JtE2A8Z5RuVatg",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCUtU4cVsod9zzLHpL5xM0kQ",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCETBxO93JjoGNkH1zRB0zwg",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCAYM7lIXVbOpCkXKSOBB44A"
          ]

          DATA_FILE = "data.json"
          INDEX_FILE = "index.html"
          SITEMAP_FILE = "sitemap.xml"
          MAX_VIDEOS = 300
          DISPLAY_CHANNEL = "Goa News 24"

          AD_WORDS = [
              "advt", "advert", "advertisement", "advertising", "sponsored",
              "sponsor", "promo", "promotion", "commercial", "publicity"
          ]

          LIVE_PHRASES = [
              "live", "livestream", "live stream", "live interaction",
              "happening now", "press conference live"
          ]

          SHORT_PHRASES = [
              "#shorts", "#short", "youtube shorts"
          ]

          def has_phrase(text, phrases):
              value = (text or "").lower()
              return any(x in value for x in phrases)

          def is_short(video):
              title = video.get("title", "")
              link = video.get("link", "")
              return "/shorts/" in link.lower() or has_phrase(title, SHORT_PHRASES)

          def is_live(video):
              title = (video.get("title", "") or "").lower()
              return bool(
                  re.search(r"\blive\b", title)
                  or "livestream" in title
                  or "live stream" in title
                  or "live interaction" in title
                  or "happening now" in title
                  or "press conference live" in title
              )

          def is_ad(video):
              return has_phrase(video.get("title", ""), AD_WORDS)

          def clean_title(title):
              text = (title or "").lower()
              text = re.sub(r"https?://\S+", " ", text)
              text = re.sub(r"#\S+", " ", text)
              for word in [
                  "breaking", "latest", "update", "updates", "exclusive",
                  "watch", "today", "news", "goa news", "goanews"
              ]:
                  text = re.sub(r"(?<!\w)" + re.escape(word) + r"(?!\w)", " ", text)
              text = re.sub(r"[^\w\s]", " ", text, flags=re.UNICODE)
              return re.sub(r"\s+", " ", text).strip()

          def similarity(a, b):
              a = clean_title(a)
              b = clean_title(b)
              if not a or not b:
                  return 0.0
              if a == b:
                  return 1.0
              ratio = SequenceMatcher(None, a, b).ratio()
              wa = set(a.split())
              wb = set(b.split())
              if wa and wb:
                  union = wa | wb
                  intersection = wa & wb
                  jaccard = len(intersection) / len(union)
              else:
                  jaccard = 0.0
              return max(ratio, jaccard)

          def timestamp(value):
              if not value:
                  return 0
              text = str(value).strip()
              try:
                  iso = text.replace("Z", "+00:00")
                  dt = datetime.fromisoformat(iso)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt.timestamp()
              except Exception:
                  pass
              try:
                  dt = parsedate_to_datetime(text)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt.timestamp()
              except Exception:
                  return 0

          def published_date(value):
              ts = timestamp(value)
              if not ts:
                  return None
              return datetime.fromtimestamp(ts, tz=timezone.utc).date()

          def escape_html(val):
              return (str(val or "")
                      .replace("&", "&amp;")
                      .replace("<", "&lt;")
                      .replace(">", "&gt;")
                      .replace('"', "&quot;")
                      .replace("'", "&#039;"))

          old_videos = []
          if os.path.exists(DATA_FILE):
              try:
                  with open(DATA_FILE, "r", encoding="utf-8") as f:
                      old_videos = json.load(f)
                  if not isinstance(old_videos, list):
                      old_videos = []
              except Exception as e:
                  print(f"WARNING: Could not read old data: {e}")

          print(f"Existing videos: {len(old_videos)}")

          new_videos = []
          for number, feed_url in enumerate(feeds, 1):
              try:
                  feed = feedparser.parse(feed_url)
                  for entry in feed.entries:
                      video_id = entry.get("yt_videoid", "") or entry.get("id", "")
                      title = entry.get("title", "").strip()
                      published = entry.get("published", "")
                      link = entry.get("link", "")
                      if not video_id or not title:
                          continue
                      new_videos.append({
                          "id": video_id,
                          "title": title,
                          "published": published,
                          "channel": DISPLAY_CHANNEL,
                          "link": link
                      })
              except Exception as e:
                  print(f"FEED ERROR: {e}")

          print(f"New RSS videos: {len(new_videos)}")

          combined = old_videos + new_videos
          cleaned = []
          removed_ads = 0
          removed_live = 0
          removed_shorts = 0

          for item in combined:
              if not isinstance(item, dict):
                  continue
              title = str(item.get("title", "")).strip()
              video_id = str(item.get("id", "") or item.get("videoId", "")).strip()
              link = str(item.get("link", "")).strip()
              published = str(item.get("published", "")).strip()
              if not title or not video_id:
                  continue
              video = {
                  "id": video_id,
                  "title": title,
                  "published": published,
                  "channel": DISPLAY_CHANNEL,
                  "link": link
              }
              if is_short(video):
                  removed_shorts += 1
                  continue
              if is_ad(video):
                  removed_ads += 1
                  continue
              if is_live(video):
                  removed_live += 1
                  continue
              cleaned.append(video)

          cleaned.sort(key=lambda x: timestamp(x["published"]), reverse=True)

          unique = []
          seen_ids = set()
          for video in cleaned:
              if video["id"] in seen_ids:
                  continue
              seen_ids.add(video["id"])
              unique.append(video)

          final_videos = []
          for video in unique:
              duplicate = False
              video_date = published_date(video["published"])
              for existing in final_videos:
                  existing_date = published_date(existing["published"])
                  if video_date != existing_date:
                      continue
                  score = similarity(video["title"], existing["title"])
                  if score >= 0.95:
                      duplicate = True
                      break
                  words_a = set(clean_title(video["title"]).split())
                  words_b = set(clean_title(existing["title"]).split())
                  if len(words_a) >= 5 and len(words_b) >= 5:
                      union = words_a | words_b
                      intersection = words_a & words_b
                      if union and (len(intersection) / len(union)) >= 0.90:
                          duplicate = True
                          break
              if not duplicate:
                  final_videos.append(video)

          final_videos.sort(key=lambda x: timestamp(x["published"]), reverse=True)
          final_videos = final_videos[:MAX_VIDEOS]

          if not final_videos:
              print("ERROR: No usable videos.")
              sys.exit(1)

          with open(DATA_FILE, "w", encoding="utf-8") as f:
              json.dump(final_videos, f, indent=2, ensure_ascii=False)

          today_iso = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          sitemap_content = f"""<?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://tvgoa.online/</loc>
              <lastmod>{today_iso}</lastmod>
              <changefreq>hourly</changefreq>
              <priority>1.0</priority>
            </url>
            <url>
              <loc>https://tvgoa.online/newspaper.html</loc>
              <lastmod>{today_iso}</lastmod>
              <changefreq>daily</changefreq>
              <priority>0.8</priority>
            </url>
          </urlset>"""
          with open(SITEMAP_FILE, "w", encoding="utf-8") as sf:
              sf.write(sitemap_content.strip())

          if os.path.exists(INDEX_FILE):
              try:
                  with open(INDEX_FILE, "r", encoding="utf-8") as inf:
                      html_content = inf.read()
                  start_marker = "<!-- SSR_NEWS_START -->"
                  end_marker = "<!-- SSR_NEWS_END -->"
                  if start_marker in html_content and end_marker in html_content:
                      top_items = final_videos[:20]
                      marathi_subtitles = [
                          "मुख्यमंत्र्यांची महत्वाची घोषणा",
                          "पावसाचा इशारा आज आणि उद्या",
                          "अपघातात 3 जण जखमी",
                          "शेतकऱ्यांना मोठा दिलासा",
                          "पर्यटन विभागाचा निर्णय",
                          "शाळांना सुट्टी जाहीर",
                          "महापालिका निवडणूक जाहीर"
                      ]
                      rendered_cards = []
                      for i, v in enumerate(top_items):
                          v_id = escape_html(v.get("id", ""))
                          title = escape_html(v.get("title", ""))
                          pub = escape_html(str(v.get("published", ""))[:10])
                          channel = escape_html(v.get("channel", DISPLAY_CHANNEL))
                          thumb = f"https://i.ytimg.com/vi/{v_id}/mqdefault.jpg" if v_id else ""
                          sub = marathi_subtitles[i % len(marathi_subtitles)]
                          card = f"""  <div class="news-block" data-video-id="{v_id}" data-title="{title}">
              <div class="headline">{title}</div>
              <div class="sub-headline">{sub}</div>
              <div class="time-tag">{pub}</div>
              <div class="news-detail">
                <div class="thumbnail"><img src="{thumb}" alt="{title}" loading="lazy"></div>
                <div class="content">
                  <div class="title">{title}</div>
                  <div class="meta">
                    <span class="channel"><i class="fas fa-user" style="color:#e63946;margin-right:4px"></i>{channel}</span>
                    <span class="views"><i class="fas fa-eye" style="margin-right:3px"></i>News</span>
                  </div>
                </div>
              </div>
            </div>"""
                          rendered_cards.append(card)

                      cards_block = "\n".join(rendered_cards)
                      pattern = rf"{re.escape(start_marker)}.*?{re.escape(end_marker)}"
                      replacement = f"{start_marker}\n{cards_block}\n{end_marker}"
                      updated_html = re.sub(pattern, replacement, html_content, flags=re.DOTALL)
                      with open(INDEX_FILE, "w", encoding="utf-8") as outf:
                          outf.write(updated_html)
              except Exception as e:
                  print(f"WARNING: Failed to pre-render index.html: {e}")
          EOF

      - name: Run script
        run: python update_videos.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json sitemap.xml index.html
          git pull --rebase origin main || true
          git diff --cached --quiet || git commit -m "Automated update: video data, pre-rendered headlines, and sitemap"
          git push origin HEAD
