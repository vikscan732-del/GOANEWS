name: Update Video Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install feedparser

      - name: Fetch and update RSS feeds
        run: |
          python << 'EOF'
          import feedparser
          import json
          import sys
          import os
          import re
          from difflib import SequenceMatcher

          feeds = [
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCzipBcQBo9rFNV58nfP-KyQ",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCE9AZSYybiCWNYKr9gbY1lA",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCJb1MeQClvGeSMeBSVLKnDQ",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCDFOkbaN9IuV6tjO8Aqo1ww",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UC-i0Rvr1-JtE2A8Z5RuVatg",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCUtU4cVsod9zzLHpL5xM0kQ",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCETBxO93JjoGNkH1zRB0zwg",
              "https://www.youtube.com/feeds/videos.xml?channel_id=UCAYM7lIXVbOpCkXKSOBB44A"
          ]

          DATA_FILE = "data.json"
          MAX_VIDEOS = 300

          # ==================================================
          # TITLE CLEANING
          # ==================================================

          def clean_title(title):
              title = title.lower()

              # Remove URLs
              title = re.sub(r'https?://\S+', ' ', title)

              # Remove common YouTube/live words
              title = re.sub(
                  r'\b(live|breaking|latest|update|updates|exclusive|'
                  r'today|watch|full video|press conference|'
                  r'goa news|goanews)\b',
                  ' ',
                  title
              )

              # Remove hashtags
              title = re.sub(r'#\w+', ' ', title)

              # Remove punctuation
              title = re.sub(r'[^a-z0-9\u0900-\u097f\u0b00-\u0b7f\s]', ' ', title)

              # Normalize spaces
              title = re.sub(r'\s+', ' ', title).strip()

              return title


          # ==================================================
          # SHORTS DETECTION
          # ==================================================

          def is_short(video):
              title = video.get("title", "").lower()
              link = video.get("link", "").lower()

              # Direct Shorts URL
              if "/shorts/" in link:
                  return True

              # Common Shorts indicators
              short_words = [
                  "#shorts",
                  "#short",
                  "shorts",
                  "youtube shorts"
              ]

              for word in short_words:
                  if word in title:
                      return True

              return False


          # ==================================================
          # NEWS DUPLICATE DETECTION
          # ==================================================

          def similar_news(title1, title2):

              a = clean_title(title1)
              b = clean_title(title2)

              if not a or not b:
                  return False

              # Exact cleaned title
              if a == b:
                  return True

              # Similarity ratio
              ratio = SequenceMatcher(None, a, b).ratio()

              # Strong similarity
              if ratio >= 0.88:
                  return True

              # Compare important words
              words_a = set(a.split())
              words_b = set(b.split())

              if len(words_a) >= 4 and len(words_b) >= 4:

                  intersection = words_a & words_b
                  union = words_a | words_b

                  jaccard = len(intersection) / len(union)

                  if jaccard >= 0.75:
                      return True

              return False


          # ==================================================
          # LOAD EXISTING DATA
          # ==================================================

          old_videos = []

          if os.path.exists(DATA_FILE):

              try:
                  with open(DATA_FILE, "r", encoding="utf-8") as f:
                      old_videos = json.load(f)

                  if not isinstance(old_videos, list):
                      old_videos = []

              except Exception as e:
                  print(f"⚠️ Error reading data.json: {e}")
                  old_videos = []

          print(f"Existing videos: {len(old_videos)}")


          # ==================================================
          # FETCH RSS
          # ==================================================

          new_videos = []

          for i, feed_url in enumerate(feeds, 1):

              print("")
              print(f"Checking feed {i}...")

              try:

                  feed = feedparser.parse(feed_url)

                  status = getattr(feed, "status", "unknown")

                  print(f"HTTP status: {status}")
                  print(f"Videos found: {len(feed.entries)}")

                  for entry in feed.entries:

                      video_id = entry.get("yt_videoid", "")

                      if not video_id:
                          video_id = entry.get("id", "")

                      title = entry.get("title", "").strip()

                      published = entry.get("published", "")

                      channel = entry.get("author", "Unknown")

                      link = entry.get("link", "")

                      if not video_id or not title:
                          continue

                      video = {
                          "id": video_id,
                          "title": title,
                          "published": published,
                          "channel": channel,
                          "link": link
                      }

                      # ======================================
                      # REMOVE SHORTS
                      # ======================================

                      if is_short(video):
                          print(f"❌ Shorts skipped: {title}")
                          continue

                      new_videos.append(video)

              except Exception as e:

                  print(f"❌ Feed error: {e}")


          print("")
          print("==============================")
          print(f"New usable videos: {len(new_videos)}")
          print("==============================")


          # ==================================================
          # COMBINE OLD + NEW
          # ==================================================

          combined = old_videos + new_videos


          # ==================================================
          # SORT NEWEST FIRST
          # ==================================================

          combined.sort(
              key=lambda x: x.get("published", ""),
              reverse=True
          )


          # ==================================================
          # REMOVE DUPLICATE VIDEO IDs
          # ==================================================

          unique_videos = []

          seen_ids = set()

          for video in combined:

              video_id = video.get("id", "")

              if not video_id:
                  continue

              if video_id in seen_ids:
                  continue

              seen_ids.add(video_id)

              unique_videos.append(video)


          print(f"After video ID filtering: {len(unique_videos)}")


          # ==================================================
          # REMOVE DUPLICATE NEWS STORIES
          # ==================================================

          final_videos = []

          for video in unique_videos:

              title = video.get("title", "")

              duplicate = False

              for existing in final_videos:

                  existing_title = existing.get("title", "")

                  if similar_news(title, existing_title):

                      print("")
                      print("❌ Duplicate news skipped:")
                      print(f"   {title}")
                      print(f"   Similar to: {existing_title}")

                      duplicate = True
                      break

              if not duplicate:
                  final_videos.append(video)


          print("")
          print("==============================")
          print(f"After news deduplication: {len(final_videos)}")
          print("==============================")


          # ==================================================
          # KEEP 300 VIDEOS
          # ==================================================

          final_videos = final_videos[:MAX_VIDEOS]


          # ==================================================
          # SAFETY CHECK
          # ==================================================

          if len(final_videos) == 0:

              print("")
              print("❌ No usable videos.")
              print("Keeping existing data.json.")

              sys.exit(1)


          # ==================================================
          # SAVE
          # ==================================================

          with open(DATA_FILE, "w", encoding="utf-8") as f:

              json.dump(
                  final_videos,
                  f,
                  indent=2,
                  ensure_ascii=False
              )


          print("")
          print("==============================")
          print(f"✅ FINAL VIDEOS: {len(final_videos)}")
          print("✅ data.json updated")
          print("==============================")


          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data.json

          git diff --cached --quiet || \
            git commit -m "Automated video data update"

          git push
