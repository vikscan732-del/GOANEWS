 const filtered=items.filter(x=>{const t=(x.title||'').toLowerCase(); const c=(x.channel||'').toLowerCase(); const cat=t.includes('crime')?'crime':t.includes('weather')?'weather':t.includes('tourism')?'tourism':t.includes('sport')||t.includes('football')?'sports':t.includes('business')?'business':t.includes('congress')||t.includes('bjp')||t.includes('election')||t.includes('mla')||t.includes('minister')||t.includes('voter')?'politics':'civic'; return (active==='all'||cat===active)&&(!q||t.includes(q)||c.includes(q))}).slice(0,50);
 count.textContent=`Showing ${filtered.length} of ${items.length} latest Goa news reports`;
 list.innerHTML=filtered.map((x,i)=>{const id=vid(x); const image=id?`https://i.ytimg.com/vi/${encodeURIComponent(id)}/mqdefault.jpg`:''; return `<article class="news-card"><div class="rank">${String(i+1).padStart(2,'0')}</div>${image?`<img src="${image}" alt="${esc(x.title)}" loading="lazy">`:''}<div class="news-body"><div class="tag">GOA NEWS</div><h2>${esc(x.title)}</h2><div class="meta"><span>${esc(x.channel)}</span><span>${dateFmt(x.published)}</span></div>${x.link?`<a class="watch" href="${esc(x.link)}" target="_blank" rel="noopener">Watch report →</a>`:''}</div></article>`}).join('')||'<div class="news-card">No matching Goa news found.</div>';
}
async function load(){try{const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok)throw new Error(); const d=await r.json(); items=(d||[]).filter(x=>x.title&&!((x.link||'').includes('/shorts/'))).sort((a,b)=>new Date(b.published)-new Date(a.published)); render();}catch(e){/* Keep the crawlable noscript content if data.json is temporarily unavailable. */ count.textContent='Latest Goa news reports';}
}
search.addEventListener('input',render);document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');active=b.dataset.filter;render()}));load();
</script>
</body></html>
