    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f1f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #0f172a;
            padding: 16px 14px 30px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 24px;
            padding: 20px 18px 30px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        }

        /* ===== HEADER — CENTERED & STACKED ===== */
        .header {
            display: block;
            text-align: center;
            padding-top: 12px;
            padding-bottom: 16px;
            margin-bottom: 18px;
            border-bottom: 1px solid #e2e8f0;
        }

        /* ===== LOGO — FULL WIDTH, RESPONSIVE ===== */
        .header-logo {
            width: 100%;
            max-width: 720px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        /* ===== HEADER RIGHT — CENTERED ===== */
        .header-right {
            text-align: center;
            margin-top: 10px;
            font-size: 13px;
            color: #475569;
            line-height: 1.5;
        }

        /* ===== SECTION TITLE ===== */
        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin: 28px 0 14px 0;
            padding-left: 12px;
            border-left: 5px solid #e63946;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .section-title .view-all {
            font-size: 13px;
            font-weight: 600;
            color: #e63946;
            cursor: pointer;
        }
        .red-dot {
            color: #e63946;
            font-size: 14px;
            margin-right: 6px;
        }

        /* ===== LIVE NOW — CHANNEL LIST ===== */
        .channel-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 6px;
        }

        .channel-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            transition: 0.2s;
        }
        .channel-item:hover {
            background: #f1f5f9;
            border-color: #e63946;
        }
        .channel-item .name {
            font-weight: 600;
            font-size: 16px;
            color: #0f172a;
        }
        .channel-item .live-badge {
            background: #e63946;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: 700;
            color: white;
        }

        /* ===== NEWS LIST ===== */
        .news-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-top: 10px;
        }

        .news-block {
            background: #f8fafc;
            border-radius: 16px;
            padding: 16px 18px;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            transition: 0.2s;
        }
        .news-block:hover {
            border-color: #e63946;
            background: #f1f5f9;
        }

        .news-block .headline {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
        }
        .news-block .sub-headline {
            font-size: 14px;
            color: #475569;
            margin: 2px 0 6px 0;
            font-weight: 500;
        }
        .news-block .time-tag {
            font-size: 13px;
            color: #e63946;
            font-weight: 600;
            margin-bottom: 8px;
            display: inline-block;
        }

        .news-block .news-detail {
            display: flex;
            gap: 14px;
            border-top: 1px solid #e2e8f0;
            padding-top: 12px;
            margin-top: 4px;
            align-items: flex-start;
        }
        .news-block .news-detail .thumbnail {
            width: 120px;
            min-height: 68px;
            background: #e2e8f0;
            border-radius: 10px;
            flex-shrink: 0;
            overflow: hidden;
        }
        .news-block .news-detail .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .news-block .news-detail .content {
            flex: 1;
        }
        .news-block .news-detail .content .title {
            font-weight: 600;
            font-size: 15px;
            color: #0f172a;
        }
        .news-block .news-detail .content .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
            font-size: 13px;
            color: #64748b;
            flex-wrap: wrap;
            gap: 4px;
        }
        .news-block .news-detail .content .meta .channel {
            font-weight: 500;
            color: #334155;
        }
        .news-block .news-detail .content .meta .views {
            color: #94a3b8;
        }

        /* ===== LOAD MORE BUTTON ===== */
        .load-more-btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: #e63946;
            color: white;
            font-weight: 700;
            font-size: 16px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .load-more-btn:hover {
            background: #c62836;
        }
        .load-more-btn.hidden {
            display: none;
        }

        /* ===== TODAY'S UPLOADS ===== */
        .uploads-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }
        .upload-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }
        .upload-item .title {
            font-weight: 600;
            font-size: 15px;
            color: #0f172a;
        }
        .upload-item .time {
            font-size: 13px;
            color: #64748b;
            background: #f1f5f9;
            padding: 2px 12px;
            border-radius: 30px;
            font-weight: 500;
        }

        /* ===== PLAYER OVERLAY ===== */
        .player-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .player-overlay.active {
            display: flex;
        }
        .player-box {
            width: 100%;
            max-width: 1100px;
            background: #0b0f1a;
            border-radius: 28px;
            overflow: hidden;
            border: 2px solid #e63946;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
        }
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: #020617;
            border-bottom: 1px solid #334155;
            flex-wrap: wrap;
            gap: 8px;
        }
        .player-header .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .player-header .left .now-playing {
            font-weight: 700;
            font-size: 17px;
            color: #facc15;
        }
        .player-header .left .live-badge {
            background: #e63946;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        .player-header .right {
            display: flex;
            gap: 10px;
        }
        .btn-close-player {
            background: #e63946;
            border: none;
            color: white;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-back-tv {
            background: #1e293b;
            border: 1px solid #facc15;
            color: #facc15;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
        }
        .player-body {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
        }
        .player-body video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }
        .player-body iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .loading-text {
            text-align: center;
            padding: 30px;
            color: #94a3b8;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .header-logo {
                width: 100%;
                height: auto;
            }
            .news-block .headline {
                font-size: 16px;
            }
            .news-block .news-detail {
                flex-direction: column;
            }
            .news-block .news-detail .thumbnail {
                width: 100%;
                height: 140px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ===== HEADER ===== -->
        <div class="header">
            <div class="logo">
                <img src="https://tvgoa.online/goa-news-logo.png" alt="GOA NEWS LIVE" class="header-logo" />
            </div>
            <div class="header-right">
                <div class="datetime" id="currentDateTime"></div>
                <div class="dev">Developed by Vikrant Naik</div>
            </div>
        </div>

        <!-- ===== LIVE NOW ===== -->
        <div class="section-title">
            <span><span class="red-dot">●</span> LIVE NOW</span>
            <span class="view-all">View All →</span>
        </div>
        <div class="channel-list" id="channelList">
            <!-- injected by JS -->
        </div>

        <!-- ===== LATEST NEWS ===== -->
        <div class="section-title">
            <span><i class="fas fa-newspaper" style="margin-right:8px; color:#e63946;"></i> Latest News From All Channels</span>
            <span class="view-all">View All →</span>
        </div>
        <div id="newsContainer" class="news-list">
            <div class="loading-text">Loading news...</div>
        </div>
        <button id="loadMoreBtn" class="load-more-btn">Load More Videos →</button>

        <!-- ===== TODAY'S UPLOADS ===== -->
        <div class="section-title">
            <span><i class="fas fa-clock" style="margin-right:8px; color:#e63946;"></i> Today's Uploads</span>
            <span class="view-all">View All →</span>
        </div>
        <div id="uploadsContainer" class="uploads-list">
            <div class="loading-text">Loading...</div>
        </div>
    </div>

    <!-- ===== PLAYER OVERLAY ===== -->
    <div id="playerOverlay" class="player-overlay">
        <div class="player-box">
            <div class="player-header">
                <div class="left">
                    <span class="live-badge">● LIVE</span>
                    <span class="now-playing" id="nowPlayingLabel">Select a channel</span>
                </div>
                <div class="right">
                    <button class="btn-back-tv" id="backToTvBtn"><i class="fas fa-arrow-left"></i> BACK</button>
                    <button class="btn-close-player" id="closePlayerBtn"><i class="fas fa-times"></i> CLOSE</button>
                </div>
            </div>
            <div class="player-body">
                <video id="playerVideo" playsinline controls></video>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        // 0. DISPLAY CURRENT DATE & TIME
        // ================================================================
        function updateDateTime() {
            const now = new Date();
            const options = { day: 'numeric', month: 'long', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true };
            const formatted = now.toLocaleDateString('en-IN', options);
            document.getElementById('currentDateTime').textContent = formatted;
        }
        updateDateTime();
        setInterval(updateDateTime, 60000);

        // ================================================================
        // 1. TV CHANNELS
        // ================================================================
        const channels = [
            { id: 'prudent', name: 'Prudent Media', stream: 'https://prudentmcdn.rixcast.com/prudentm.m3u8' },
            { id: 'goanewshub', name: 'Goa 365', stream: 'https://satpros.tech/hls/goa365tv/live_tv_stream/index.m3u8' },
            { id: 'ingoa', name: 'Prime', stream: 'https://primetvgoa.rixcast.com/primegoa.m3u8' },
            { id: 'DD Goa', name: 'DD Goa', stream: 'https://d3eyhgoylams0m.cloudfront.net/v1/manifest/93ce20f0f52760bf38be911ff4c91ed02aa2fd92/ed7bd2c7-8d10-4051-b397-2f6b90f99acb/a556fd55-3d07-4069-9f3d-6cda1e3192f8/2.m3u8' },
            { id: 'rdxgoa', name: 'RDX GOA', stream: 'https://g5nl6xoalpq6-hls-live.5centscdn.com/rdxgoa/d0dbe915091d400bd8ee7f27f0791303.sdp/chunks_dvr.m3u8' }
        ];

        const channelList = document.getElementById('channelList');

        function renderChannels() {
            channelList.innerHTML = channels.map(ch => `
                <div class="channel-item" data-channel-id="${ch.id}">
                    <span class="name"><i class="fas fa-tv" style="color:#e63946; margin-right:10px;"></i> ${ch.name}</span>
                    <span class="live-badge">● LIVE</span>
                </div>
            `).join('');

            document.querySelectorAll('.channel-item').forEach(item => {
                item.addEventListener('click', function() {
                    const id = this.dataset.channelId;
                    const channel = channels.find(c => c.id === id);
                    if (channel) playTVChannel(channel);
                });
            });
        }

        // ================================================================
        // 2. PLAY TV CHANNEL
        // ================================================================
        let hls = null;
        const playerOverlay = document.getElementById('playerOverlay');
        const playerVideo = document.getElementById('playerVideo');
        const nowPlayingLabel = document.getElementById('nowPlayingLabel');
        const backToTvBtn = document.getElementById('backToTvBtn');
        const closePlayerBtn = document.getElementById('closePlayerBtn');

        function playTVChannel(channel) {
            nowPlayingLabel.textContent = channel.name;
            if (hls) { hls.destroy(); hls = null; }
            playerOverlay.classList.add('active');

            if (Hls.isSupported()) {
                hls = new Hls({ enableWorker: true, lowLatencyMode: true, maxBufferLength: 60 });
                hls.loadSource(channel.stream);
                hls.attachMedia(playerVideo);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    playerVideo.play().catch(e => console.log('Auto-play blocked:', e));
                });
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        console.error('HLS fatal error:', data);
                        nowPlayingLabel.textContent = '⚠️ Stream error - try another channel';
                    }
                });
            } else if (playerVideo.canPlayType('application/vnd.apple.mpegurl')) {
                playerVideo.src = channel.stream;
                playerVideo.play().catch(e => console.log(e));
            } else {
                nowPlayingLabel.textContent = '❌ HLS not supported';
            }
        }

        function closePlayer() {
            if (hls) { hls.destroy(); hls = null; }
            playerVideo.pause();
            playerVideo.src = '';
            playerVideo.load();
            playerOverlay.classList.remove('active');
        }

        backToTvBtn.addEventListener('click', closePlayer);
        closePlayerBtn.addEventListener('click', closePlayer);
        playerOverlay.addEventListener('click', (e) => { if (e.target === playerOverlay) closePlayer(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePlayer(); });

        // ================================================================
        // 3. YOUTUBE NEWS – WITH LOAD MORE
        // ================================================================
        const DATA_URL = 'data.json';
        const newsContainer = document.getElementById('newsContainer');
        const uploadsContainer = document.getElementById('uploadsContainer');
        const loadMoreBtn = document.getElementById('loadMoreBtn');

        let allFilteredNews = [];
        let displayCount = 20;
        const STEP = 10;

        function getVideoId(link) {
            try { const url = new URL(link); return url.searchParams.get('v'); } catch { return null; }
        }

        function formatTime(iso) {
            const d = new Date(iso);
            return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
        }

        const marathiHeadlines = [
            'मांदवी नदी तेचेसी दुबोकेची बीर बिलन झाड़दू',
            'मुख्यमंत्र्यांची महत्वाची घोषणा',
            'पावसाचा झशरा आज आणि उदा',
            'अपघातात 3 जण जखमी',
            'शेतकऱ्यांना मोठा दिलासा',
            'पर्यटन विभागाचा निर्णय',
            'शाळांना सुट्टी जाहीर',
            'महापालिका निवडणूक जाहीर'
        ];

        function renderNews(videos, reset = true) {
            if (!videos || videos.length === 0) {
                newsContainer.innerHTML = `<div class="loading-text">No news videos found.</div>`;
                loadMoreBtn.classList.add('hidden');
                return;
            }

            const filtered = videos.filter(v => {
                const link = v.link || '';
                const title = v.title || '';
                return !(link.includes('/shorts/') || /#shorts/i.test(title));
            });

            if (filtered.length === 0) {
                newsContainer.innerHTML = `<div class="loading-text">No news available.</div>`;
                loadMoreBtn.classList.add('hidden');
                return;
            }

            if (reset) {
                allFilteredNews = filtered;
                displayCount = Math.min(20, allFilteredNews.length);
            }

            const total = allFilteredNews.length;
            const toShow = allFilteredNews.slice(0, displayCount);

            let html = toShow.map((v, index) => {
                const vid = getVideoId(v.link);
                const thumb = vid ? `https://i.ytimg.com/vi/${vid}/mqdefault.jpg` : '';
                const marathi = marathiHeadlines[index % marathiHeadlines.length];
                const timeTag = `${Math.floor(Math.random() * 5 + 2)}:${String(Math.floor(Math.random() * 59 + 10)).padStart(2, '0')}`;
                const views = `${Math.floor(Math.random() * 4 + 1)}.${Math.floor(Math.random() * 9 + 1)}K views`;
                const timeAgo = `${Math.floor(Math.random() * 60 + 5)} minutes ago`;
                return `
                    <div class="news-block" data-video-id="${vid}" data-title="${v.title}">
                        <div class="headline">${v.title}</div>
                        <div class="sub-headline">${marathi}</div>
                        <div class="time-tag">${timeTag}</div>
                        <div class="news-detail">
                            <div class="thumbnail">
                                <img src="${thumb}" alt="thumbnail" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22120%22 height=%2268%22%3E%3Crect fill=%22%23e2e8f0%22 width=%22120%22 height=%2268%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%2394a3b8%22 font-size=%2212%22%3ENo%20Image%3C/text%3E%3C/svg%3E'">
                            </div>
                            <div class="content">
                                <div class="title">${v.title}</div>
                                <div class="meta">
                                    <span class="channel"><i class="fas fa-user" style="color:#e63946; margin-right:4px;"></i> ${v.channel}</span>
                                    <span class="time-ago">${timeAgo}</span>
                                    <span class="views"><i class="fas fa-eye" style="margin-right:3px;"></i> ${views}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            newsContainer.innerHTML = html;

            document.querySelectorAll('.news-block').forEach(block => {
                block.addEventListener('click', function() {
                    const vid = this.dataset.videoId;
                    const title = this.dataset.title;
                    if (vid) playYouTubeVideo(vid, title);
                });
            });

            if (displayCount < total) {
                loadMoreBtn.classList.remove('hidden');
                loadMoreBtn.textContent = `Load More (${displayCount}/${total}) →`;
            } else {
                loadMoreBtn.classList.add('hidden');
            }
        }

        loadMoreBtn.addEventListener('click', function() {
            const total = allFilteredNews.length;
            const newCount = Math.min(displayCount + STEP, total);
            displayCount = newCount;
            renderNews(allFilteredNews, false);
        });

        // ================================================================
        // 4. PLAY YOUTUBE VIDEO
        // ================================================================
        function playYouTubeVideo(videoId, title) {
            if (!videoId) return;
            const embedUrl = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0`;
            const playerBody = document.querySelector('.player-body');
            const oldIframe = playerBody.querySelector('iframe');
            if (oldIframe) oldIframe.remove();

            playerVideo.style.display = 'none';
            const iframe = document.createElement('iframe');
            iframe.src = embedUrl;
            iframe.allow = 'autoplay; encrypted-media; fullscreen';
            iframe.allowFullscreen = true;
            iframe.style.position = 'absolute';
            iframe.style.top = '0';
            iframe.style.left = '0';
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.border = 'none';
            playerBody.appendChild(iframe);

            nowPlayingLabel.textContent = title || 'YouTube Video';
            playerOverlay.classList.add('active');
        }

        const originalClose = closePlayer;
        closePlayer = function() {
            const playerBody = document.querySelector('.player-body');
            const iframe = playerBody.querySelector('iframe');
            if (iframe) iframe.remove();
            playerVideo.style.display = 'block';
            originalClose();
        };
        backToTvBtn.onclick = closePlayer;
        closePlayerBtn.onclick = closePlayer;
        playerOverlay.onclick = (e) => { if (e.target === playerOverlay) closePlayer(); };
        document.onkeydown = (e) => { if (e.key === 'Escape') closePlayer(); };

        // ================================================================
        // 5. TODAY'S UPLOADS
        // ================================================================
        function renderUploads(videos) {
            if (!videos || videos.length === 0) {
                uploadsContainer.innerHTML = `<div class="loading-text">No uploads today</div>`;
                return;
            }

            const filtered = videos.filter(v => {
                const link = v.link || '';
                const title = v.title || '';
                return !(link.includes('/shorts/') || /#shorts/i.test(title));
            });

            const latest = filtered.slice(0, 5);
            if (latest.length === 0) {
                uploadsContainer.innerHTML = `<div class="loading-text">No uploads today</div>`;
                return;
            }

            uploadsContainer.innerHTML = latest.map(v => `
                <div class="upload-item">
                    <span class="title"><i class="fas fa-upload" style="color:#e63946; margin-right:8px;"></i> ${v.title}</span>
                    <span class="time">${formatTime(v.published)}</span>
                </div>
            `).join('');
        }

        // ================================================================
        // 6. LOAD DATA
        // ================================================================
        async function loadData() {
            try {
                const response = await fetch(DATA_URL + '?t=' + Date.now());
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                renderNews(data, true);
                renderUploads(data);
            } catch (e) {
                newsContainer.innerHTML = `<div class="loading-text">⚠️ Could not load news. Please refresh.</div>`;
                loadMoreBtn.classList.add('hidden');
            }
        }

        // ================================================================
        // 7. INIT
        // ================================================================
        renderChannels();
        loadData();
        setInterval(loadData, 10 * 60 * 1000);
    </script>
</body>
</html>
