<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GOA NEWS LIVE</title>
    <!-- HLS.js for m3u8 playback -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f1f5f9;
            padding: 16px 14px 30px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #334155;
        }

        .logo h1 {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(to right, #facc15, #22d3ee);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo small {
            display: block;
            font-size: 12px;
            color: #94a3b8;
        }

        .header-right {
            text-align: right;
            font-size: 13px;
            color: #94a3b8;
        }
        .home-tag {
            display: inline-block;
            background: #facc15;
            color: #0f172a;
            padding: 4px 14px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 12px;
            margin-bottom: 4px;
        }
        .dev {
            font-size: 11px;
            color: #64748b;
        }

        /* ===== SECTION TITLE ===== */
        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin: 28px 0 14px 0;
            padding-left: 12px;
            border-left: 5px solid #facc15;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .section-title .view-all {
            font-size: 13px;
            font-weight: 600;
            color: #facc15;
            cursor: pointer;
        }
        .red-dot {
            color: #ef4444;
            font-size: 14px;
            margin-right: 6px;
        }

        /* ===== LIVE NOW — CHANNEL LIST (TEXT) ===== */
        .channel-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 6px;
        }

        .channel-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            cursor: pointer;
            transition: 0.2s;
        }
        .channel-item:hover {
            border-color: #facc15;
            background: #253450;
        }
        .channel-item .name {
            font-weight: 600;
            font-size: 16px;
        }
        .channel-item .live-badge {
            background: #ef4444;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: 700;
            color: white;
        }
        .channel-item .live-badge.off {
            background: #334155;
            color: #94a3b8;
        }

        /* ===== NEWS LIST ===== */
        .news-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-top: 10px;
        }

        .news-block {
            background: #1e293b;
            border-radius: 16px;
            padding: 16px 18px;
            border: 1px solid #334155;
            cursor: pointer;
            transition: 0.2s;
        }
        .news-block:hover {
            border-color: #facc15;
        }

        .news-block .headline {
            font-size: 18px;
            font-weight: 700;
            color: #facc15;
        }
        .news-block .sub-headline {
            font-size: 14px;
            color: #cbd5e1;
            margin: 2px 0 6px 0;
            font-weight: 500;
        }
        .news-block .time-tag {
            font-size: 13px;
            color: #facc15;
            font-weight: 600;
            margin-bottom: 8px;
            display: inline-block;
        }

        .news-block .news-detail {
            border-top: 1px solid #334155;
            padding-top: 10px;
            margin-top: 4px;
        }
        .news-block .news-detail .title {
            font-weight: 600;
            font-size: 15px;
        }
        .news-block .news-detail .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
            font-size: 13px;
            color: #94a3b8;
        }
        .news-block .news-detail .meta .channel {
            font-weight: 500;
        }
        .news-block .news-detail .meta .views {
            color: #64748b;
        }

        /* ===== TODAY'S UPLOADS ===== */
        .uploads-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }
        .upload-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        .upload-item .title {
            font-weight: 600;
            font-size: 15px;
        }
        .upload-item .time {
            font-size: 13px;
            color: #94a3b8;
            background: #0f172a;
            padding: 2px 12px;
            border-radius: 30px;
            font-weight: 500;
        }

        /* ===== PLAYER OVERLAY (unchanged) ===== */
        .player-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .player-overlay.active {
            display: flex;
        }
        .player-box {
            width: 100%;
            max-width: 1100px;
            background: #0b0f1a;
            border-radius: 28px;
            overflow: hidden;
            border: 2px solid #facc15;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
        }
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: #020617;
            border-bottom: 1px solid #334155;
            flex-wrap: wrap;
            gap: 8px;
        }
        .player-header .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .player-header .left .now-playing {
            font-weight: 700;
            font-size: 17px;
            color: #facc15;
        }
        .player-header .left .live-badge {
            background: #ef4444;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        .player-header .right {
            display: flex;
            gap: 10px;
        }
        .btn-close-player {
            background: #ef4444;
            border: none;
            color: white;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-back-tv {
            background: #1e293b;
            border: 1px solid #facc15;
            color: #facc15;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
        }
        .player-body {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
        }
        .player-body video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }
        .player-body iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .loading-text {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
            .header-right {
                text-align: left;
                width: 100%;
            }
            .logo h1 {
                font-size: 22px;
            }
            .news-block .headline {
                font-size: 16px;
            }
            .channel-item .name {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ===== HEADER ===== -->
        <div class="header">
            <div class="logo">
                <h1>GOA NEWS LIVE</h1>
                <small>All Goa News, One Place</small>
            </div>
            <div class="header-right">
                <div class="home-tag">HOME</div>
                <div class="dev">Developed by Vikrant Naik</div>
            </div>
        </div>

        <!-- ===== LIVE NOW (Channel List) ===== -->
        <div class="section-title">
            <span><span class="red-dot">●</span> LIVE NOW</span>
            <span class="view-all">View All →</span>
        </div>
        <div class="channel-list" id="channelList">
            <!-- injected by JS -->
        </div>

        <!-- ===== LATEST NEWS ===== -->
        <div class="section-title">
            <span><i class="fas fa-newspaper" style="margin-right:8px; color:#facc15;"></i> Latest News From All Channels</span>
            <span class="view-all">View All →</span>
        </div>
        <div id="newsContainer" class="news-list">
            <div class="loading-text">Loading news...</div>
        </div>

        <!-- ===== TODAY'S UPLOADS ===== -->
        <div class="section-title">
            <span><i class="fas fa-clock" style="margin-right:8px; color:#facc15;"></i> Today's Uploads</span>
            <span class="view-all">View All →</span>
        </div>
        <div id="uploadsContainer" class="uploads-list">
            <div class="loading-text">Loading...</div>
        </div>
    </div>

    <!-- ===== PLAYER OVERLAY ===== -->
    <div id="playerOverlay" class="player-overlay">
        <div class="player-box">
            <div class="player-header">
                <div class="left">
                    <span class="live-badge">● LIVE</span>
                    <span class="now-playing" id="nowPlayingLabel">Select a channel</span>
                </div>
                <div class="right">
                    <button class="btn-back-tv" id="backToTvBtn"><i class="fas fa-arrow-left"></i> BACK</button>
                    <button class="btn-close-player" id="closePlayerBtn"><i class="fas fa-times"></i> CLOSE</button>
                </div>
            </div>
            <div class="player-body">
                <video id="playerVideo" playsinline controls></video>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        // 1. TV CHANNELS (5 Goa channels)
        // ================================================================
        const channels = [
            { id: 'prudent', name: 'Prudent Media', stream: 'https://prudentmcdn.rixcast.com/prudentm.m3u8' },
            { id: 'goanewshub', name: 'Goa News Hub', stream: 'https://satpros.tech/hls/goa365tv/live_tv_stream/index.m3u8' },
            { id: 'ingoa', name: 'InGoa 24x7', stream: 'https://primetvgoa.rixcast.com/primegoa.m3u8' },
            { id: 'goa365', name: 'Goa 365', stream: 'https://satpros.tech/hls/goa365tv/live_tv_stream/index.m3u8' },
            { id: 'gomantak', name: 'GOMANTAK TV', stream: 'https://g5nl6xoalpq6-hls-live.5centscdn.com/rdxgoa/d0dbe915091d400bd8ee7f27f0791303.sdp/chunks_dvr.m3u8' }
        ];

        // ================================================================
        // 2. RENDER CHANNEL LIST (Text-based, like screenshot)
        // ================================================================
        const channelList = document.getElementById('channelList');

        function renderChannels() {
            channelList.innerHTML = channels.map(ch => `
                <div class="channel-item" data-channel-id="${ch.id}">
                    <span class="name">${ch.name}</span>
                    <span class="live-badge">● LIVE</span>
                </div>
            `).join('');

            document.querySelectorAll('.channel-item').forEach(item => {
                item.addEventListener('click', function() {
                    const id = this.dataset.channelId;
                    const channel = channels.find(c => c.id === id);
                    if (channel) playTVChannel(channel);
                });
            });
        }

        // ================================================================
        // 3. PLAY TV CHANNEL
        // ================================================================
        let hls = null;
        const playerOverlay = document.getElementById('playerOverlay');
        const playerVideo = document.getElementById('playerVideo');
        const nowPlayingLabel = document.getElementById('nowPlayingLabel');
        const backToTvBtn = document.getElementById('backToTvBtn');
        const closePlayerBtn = document.getElementById('closePlayerBtn');

        function playTVChannel(channel) {
            nowPlayingLabel.textContent = channel.name;
            if (hls) { hls.destroy(); hls = null; }
            playerOverlay.classList.add('active');

            if (Hls.isSupported()) {
                hls = new Hls({ enableWorker: true, lowLatencyMode: true, maxBufferLength: 60 });
                hls.loadSource(channel.stream);
                hls.attachMedia(playerVideo);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    playerVideo.play().catch(e => console.log('Auto-play blocked:', e));
                });
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        console.error('HLS fatal error:', data);
                        nowPlayingLabel.textContent = '⚠️ Stream error - try another channel';
                    }
                });
            } else if (playerVideo.canPlayType('application/vnd.apple.mpegurl')) {
                playerVideo.src = channel.stream;
                playerVideo.play().catch(e => console.log(e));
            } else {
                nowPlayingLabel.textContent = '❌ HLS not supported';
            }
        }

        function closePlayer() {
            if (hls) { hls.destroy(); hls = null; }
            playerVideo.pause();
            playerVideo.src = '';
            playerVideo.load();
            playerOverlay.classList.remove('active');
        }

        backToTvBtn.addEventListener('click', closePlayer);
        closePlayerBtn.addEventListener('click', closePlayer);
        playerOverlay.addEventListener('click', (e) => { if (e.target === playerOverlay) closePlayer(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePlayer(); });

        // ================================================================
        // 4. YOUTUBE NEWS GRID (from data.json)
        // ================================================================
        const DATA_URL = 'data.json';
        const newsContainer = document.getElementById('newsContainer');
        const uploadsContainer = document.getElementById('uploadsContainer');

        function getVideoId(link) {
            try { const url = new URL(link); return url.searchParams.get('v'); } catch { return null; }
        }

        function formatTime(iso) {
            const d = new Date(iso);
            return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
        }

        // Fake Marathi headlines for demo (matches screenshot)
        const marathiHeadlines = [
            'मांदवी नदी तेचेसी दुबोकेची बीर बिलन झाड़दू',
            'मुख्यमंत्र्यांची महत्वाची घोषणा',
            'पावसाचा झशरा आज आणि उदा',
            'अपघातात 3 जण जखमी',
            'शेतकऱ्यांना मोठा दिलासा',
            'पर्यटन विभागाचा निर्णय',
            'शाळांना सुट्टी जाहीर',
            'महापालिका निवडणूक जाहीर'
        ];

        function renderNews(videos) {
            if (!videos || videos.length === 0) {
                newsContainer.innerHTML = `<div class="loading-text">No news videos found.</div>`;
                return;
            }

            const filtered = videos.filter(v => {
                const link = v.link || '';
                const title = v.title || '';
                return !(link.includes('/shorts/') || /#shorts/i.test(title));
            });

            if (filtered.length === 0) {
                newsContainer.innerHTML = `<div class="loading-text">No news available.</div>`;
                return;
            }

            const topNews = filtered.slice(0, 8);
            newsContainer.innerHTML = topNews.map((v, index) => {
                const vid = getVideoId(v.link);
                const marathi = marathiHeadlines[index % marathiHeadlines.length];
                const timeTag = `${Math.floor(Math.random() * 5 + 2)}:${String(Math.floor(Math.random() * 59 + 10)).padStart(2, '0')}`;
                const views = `${Math.floor(Math.random() * 4 + 1)}.${Math.floor(Math.random() * 9 + 1)}K views`;
                const timeAgo = `${Math.floor(Math.random() * 60 + 5)} minutes ago`;
                return `
                    <div class="news-block" data-video-id="${vid}" data-title="${v.title}">
                        <div class="headline">${v.title}</div>
                        <div class="sub-headline">${marathi}</div>
                        <div class="time-tag">${timeTag}</div>
                        <div class="news-detail">
                            <div class="title">${v.title}</div>
                            <div class="meta">
                                <span class="channel">${v.channel}</span>
                                <span class="time-ago">${timeAgo}</span>
                                <span class="views">👁️ ${views}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            document.querySelectorAll('.news-block').forEach(block => {
                block.addEventListener('click', function() {
                    const vid = this.dataset.videoId;
                    const title = this.dataset.title;
                    if (vid) playYouTubeVideo(vid, title);
                });
            });
        }

        // ================================================================
        // 5. PLAY YOUTUBE VIDEO
        // ================================================================
        function playYouTubeVideo(videoId, title) {
            if (!videoId) return;
            const embedUrl = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0`;
            const playerBody = document.querySelector('.player-body');
            const oldIframe = playerBody.querySelector('iframe');
            if (oldIframe) oldIframe.remove();

            playerVideo.style.display = 'none';
            const iframe = document.createElement('iframe');
            iframe.src = embedUrl;
            iframe.allow = 'autoplay; encrypted-media; fullscreen';
            iframe.allowFullscreen = true;
            iframe.style.position = 'absolute';
            iframe.style.top = '0';
            iframe.style.left = '0';
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.border = 'none';
            playerBody.appendChild(iframe);

            nowPlayingLabel.textContent = title || 'YouTube Video';
            playerOverlay.classList.add('active');
        }

        // Override closePlayer to cleanup iframe
        const originalClose = closePlayer;
        closePlayer = function() {
            const playerBody = document.querySelector('.player-body');
            const iframe = playerBody.querySelector('iframe');
            if (iframe) iframe.remove();
            playerVideo.style.display = 'block';
            originalClose();
        };
        backToTvBtn.onclick = closePlayer;
        closePlayerBtn.onclick = closePlayer;
        playerOverlay.onclick = (e) => { if (e.target === playerOverlay) closePlayer(); };
        document.onkeydown = (e) => { if (e.key === 'Escape') closePlayer(); };

        // ================================================================
        // 6. TODAY'S UPLOADS
        // ================================================================
        function renderUploads(videos) {
            if (!videos || videos.length === 0) {
                uploadsContainer.innerHTML = `<div class="loading-text">No uploads today</div>`;
                return;
            }

            const filtered = videos.filter(v => {
                const link = v.link || '';
                const title = v.title || '';
                return !(link.includes('/shorts/') || /#shorts/i.test(title));
            });

            const latest = filtered.slice(0, 5);
            if (latest.length === 0) {
                uploadsContainer.innerHTML = `<div class="loading-text">No uploads today</div>`;
                return;
            }

            uploadsContainer.innerHTML = latest.map(v => `
                <div class="upload-item">
                    <span class="title">${v.title}</span>
                    <span class="time">${formatTime(v.published)}</span>
                </div>
            `).join('');
        }

        // ================================================================
        // 7. LOAD DATA
        // ================================================================
        async function loadData() {
            try {
                const response = await fetch(DATA_URL + '?t=' + Date.now());
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                renderNews(data);
                renderUploads(data);
            } catch (e) {
                newsContainer.innerHTML = `<div class="loading-text">⚠️ Could not load news. Please refresh.</div>`;
            }
        }

        // ================================================================
        // 8. INIT
        // ================================================================
        renderChannels();
        loadData();
        setInterval(loadData, 10 * 60 * 1000);
    </script>
</body>
</html>
